<el-dialog>
  <dialog id="drawer" aria-labelledby="drawer-title" class="fixed inset-0 size-auto max-h-none max-w-none overflow-hidden bg-transparent backdrop:bg-transparent">
    <div tabindex="0" class="absolute inset-0 pl-10 focus:outline-none sm:pl-16">
      <el-dialog-panel class="group/dialog-panel ml-auto block size-full max-w-md transform transition duration-500 ease-in-out data-closed:translate-x-full sm:duration-700">
        <div class="relative flex h-full flex-col overflow-y-auto bg-white shadow-xl dark:bg-gray-800 dark:after:absolute dark:after:inset-y-0 dark:after:left-0 dark:after:w-px dark:after:bg-white/10">
          <div class="p-6">
            <div class="flex items-start justify-between">
              <h2 id="drawer-title" class="text-base font-semibold text-gray-900 dark:text-white">Detaily</h2>
              <div class="ml-3 flex h-7 items-center">
                <button type="button" command="close" commandfor="drawer" class="relative rounded-md text-gray-400 hover:text-gray-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-hostify-blue dark:hover:text-white dark:focus-visible:outline-hostify-blue cursor-pointer">
                  <span class="absolute -inset-2.5"></span>
                  <span class="sr-only">Close panel</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6">
                    <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="border-b border-gray-200 dark:border-white/10">
            <div class="px-6">
              <!-- Tab component -->
              <nav class="-mb-px flex space-x-6">
                <!-- Current: "border-hostify-blue text-hostify-blue dark:text-hostify-blue", Default: "border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-400 dark:hover:border-white/20 dark:hover:text-white" -->
                <button data-tab="plugins" class="tab-trigger tab-btn-active whitespace-nowrap border-b-2 border-hostify-blue px-1 pb-4 text-sm font-medium text-hostify-blue cursor-pointer">
                  Pluginy
                </button>
                <button data-tab="ports" class="tab-trigger tab-btn-inactive whitespace-nowrap border-b-2 border-transparent px-1 pb-4 text-sm font-medium text-gray-500 hover:border-gray-300 hover:text-gray-700 cursor-pointer">
                  Porty
                </button>
                <button data-tab="leaks" class="tab-trigger tab-btn-inactive whitespace-nowrap border-b-2 border-transparent px-1 pb-4 text-sm font-medium text-gray-500 hover:border-gray-300 hover:text-gray-700 cursor-pointer">
                  Leaky
                </button>
              </nav>
            </div>
          </div>
          <ul role="list" class="flex-1 divide-y px-2 divide-gray-200 overflow-y-auto dark:divide-white/10">
            {# if plugins#}
            <div class="relative my-2 flex items-center">
              <input
                type="text"
                name="search"
                id="search"
                class="pl-2 block w-full rounded-md border-0 py-1.5 pr-14 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6"
              />
              <div class="absolute inset-y-0 right-0 flex py-1.5 pr-1.5">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                  class="inline-flex h-6 w-6 items-center rounded border border-gray-200 px-1 font-sans text-xs text-gray-400"
                >
                  <path
                    fill-rule="evenodd"
                    d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z"
                    clip-rule="evenodd"
                  />
                </svg>
              </div>
            </div>
            
            {# end if #}

            {% for plugin in plugins %}
              {% include "plugin_item.html" %}
            {% endfor %}
          </ul>
        </div>
      </el-dialog-panel>
    </div>
  </dialog>
</el-dialog>
