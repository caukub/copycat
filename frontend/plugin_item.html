<li>
    <div class="group relative flex items-center px-2 py-1 sm:px-4 sm:py-5">
        <div class="-m-1 block flex-1 p-1">
            <div class="absolute inset-0 group-hover:bg-gray-50" aria-hidden="true"></div>
            <div class="relative flex min-w-0 flex-1 items-center">
                <div class="ml-4 truncate">
                    <p class="pluginName truncate whitespace-pre-wrap text-sm font-medium text-gray-900">
                        {{- plugin.name -}}
                    </p>
                    <p class="pluginVersion truncate whitespace-pre-wrap text-sm text-gray-500">
                        {%- if let Some(version) = plugin.version -%}
                          {{- version -}}
                        {%- endif -%}
                    </p>
                </div>
            </div>
        </div>
    </div>
</li>
