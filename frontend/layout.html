<!DOCTYPE html>
<html lang="cs">
<meta charset="UTF-8">
<title>{% block title %}Paste | Hostify.cz{% endblock %}</title>
{% block head %}{% endblock %}
<meta name="viewport" content="width=device-width,initial-scale=1">
<noscript>
    <style>
        .nojs-hide {
            display: none !important;
        }
    </style>
</noscript>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="stylesheet" href="/assets/styles.css">
<body>    
    {% include "navbar.html" %}
    
    <main class="container mx-auto">
        {% block content %}{% endblock %}
    </main>
    
    {% include "footer.html" %}
    
    <style>
        main {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                Segoe UI,
                Roboto,
                Helvetica Neue,
                Arial,
                Noto Sans,
                Liberation Sans,
                sans-serif,
                'Apple Color Emoji',
                'Segoe UI Emoji',
                Segoe UI Symbol,
                'Noto Color Emoji';
    
            max-width: calc(100vw - 3%);
        }
    </style>
</body>
</html>
