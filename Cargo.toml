[package]
name = "copycat"
version = "0.1.0"
authors = ["caukub"]
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "copycat"

[features]
default = ["magika"]
magika = ["dep:magika"]


[dependencies]
askama = "0.15.1"
axum = { version = "0.8.8", features = ["multipart"] }
config = "0.15.19"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
tokio = { version = "1.49.0", features = ["signal", "net", "rt-multi-thread", "io-util", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
# mclog = { version = "0.1.0", path = "../mclog" }
mclog = { git = "https://github.com/caukub/mclog.git" }
magika = { version = "1.1.0", optional = true }
ort = "=2.0.0-rc.12"
futures-util = "0.3.31"
tokio-util = { version = "0.7.18", features = ["io"] }
serde_json = "1.0.149"
tower-http = { version = "0.6.8", features = ["fs", "cors"] }