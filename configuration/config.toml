[application]
host = "::1"
port = 3000
body_limit_in_bytes = 100_000_000

[storage]
directory = "data"
max_size_in_bytes = 2_500_000

[paste]
id_length = 8
expiration_in_hours = 8_640

[parser]
level_suffix_lines_limit = 200
custom_highlighting_delimiters = ["Multicraft]", "PebbleHost]", "PebbleHost Loader]", "[Hosting]:", "Hosting:"]

[analyzer]
limits = "versions (server, plugins, mods) AND port (server, plugins, mods)"

[cors]
allow_origin = "*"

[api]